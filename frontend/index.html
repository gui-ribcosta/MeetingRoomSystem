<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <title>Meeting Room System</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

  <div class="layout">

    <aside class="sidebar">

      <div class="sidebar-header">
        <h2>Rooms</h2>
        <button class="close-menu" onclick="toggleMenu()" title="Fechar menu"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <nav>
        <button onclick="scrollToSection('criar')" title="Criar uma nova sala"><i class="fa-solid fa-plus"
            style="width: 20px;"></i> Criar sala</button>
        <button onclick="scrollToSection('salas')" title="Listar salas disponíveis"><i class="fa-solid fa-list"
            style="width: 20px;"></i> Salas</button>
        <button onclick="scrollToSection('entrar')" title="Entrar em uma sala"><i class="fa-solid fa-right-to-bracket"
            style="width: 20px;"></i> Entrar</button>
      </nav>

    </aside>

    <main class="content">

      <header>
        <div class="header-titles">
          <h1>Meeting Room System</h1>
          <p>GERENCIE SALAS E PARTICIPANTES</p>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()" title="Abrir menu lateral">
          <i class="fa-solid fa-bars"></i>
        </button>
      </header>

      <section id="criar" class="card">

        <h3>CRIAR SALA</h3>

        <input id="nomeSala" placeholder="Nome da sala">

        <button onclick="criarSala()" title="Clique para criar uma nova sala">Criar sala</button>

      </section>

      <section id="salas" class="card">

        <h3>SALAS DISPONÍVEIS</h3>

        <input id="buscarSala" placeholder="🔎 Buscar sala..." oninput="filtrarSalas()">

        <div id="listaSalas"></div>

      </section>

      <section id="entrar" class="card">

        <h3>ENTRAR NA SALA</h3>

        <input id="salaNome" placeholder="Nome da sala">

        <input id="codigo" placeholder="Código de acesso">

        <button onclick="entrar()" title="Clique para entrar na sala escolhida">Entrar</button>

        <p id="resultado"></p>

      </section>

    </main>

  </div>

  <script src="script.js"></script>

</body>

</html>
